name: kjbn-vm

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: kjbn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe password in .env}
      POSTGRES_DB: kjbn
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kjbn -d kjbn"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:?Set the published backend image in .env}
    environment:
      DATABASE_URL: postgresql://kjbn:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/kjbn?schema=public
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set the frontend HTTP(S) origin},${BACKEND_ORIGIN:?Set the backend HTTP(S) origin}
      REVIEW_MODE: ${REVIEW_MODE:-true}
      SEED_DEMO_DATA: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:?Set the published frontend image in .env}
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *logging
